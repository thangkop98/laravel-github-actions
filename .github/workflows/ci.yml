name: Laravel CI - lession 1

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "Hello Github Actions"
      
      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -la
      
      - name: Show PHP version
        run: php -v
      
      - name: Show Composer version
        run: composer --version
