name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: CI - Test Application
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: laravel_test
          MYSQL_USER: laravel_test
          MYSQL_PASSWORD: testing_password
          MYSQL_ROOT_PASSWORD: root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, xml, curl, zip, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare testing environment
        run: php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate:fresh --env=testing --force

      - name: Run tests
        run: php artisan test

  deploy:
    name: CD - Deploy Production
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd /var/www/laravel-app

            git pull origin main

            composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            php artisan migrate --force

            php artisan optimize